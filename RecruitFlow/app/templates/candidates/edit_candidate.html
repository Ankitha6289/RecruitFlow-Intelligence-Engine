{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h3>Edit Candidate</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6">

                        <div class="mb-3">

                            <label class="form-label">

                                Full Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="full_name"
                                value="{{ candidate.full_name }}"
                                required>

                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                value="{{ candidate.email }}"
                                required>

                        </div>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6">

                        <div class="mb-3">

                            <label class="form-label">

                                Phone

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="phone"
                                value="{{ candidate.phone }}">

                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="mb-3">

                            <label class="form-label">

                                Address

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="address"
                                value="{{ candidate.address }}">

                        </div>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6">

                        <div class="mb-3">

                            <label class="form-label">

                                LinkedIn

                            </label>

                            <input
                                type="url"
                                class="form-control"
                                name="linkedin"
                                value="{{ candidate.linkedin }}">

                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="mb-3">

                            <label class="form-label">

                                GitHub

                            </label>

                            <input
                                type="url"
                                class="form-control"
                                name="github"
                                value="{{ candidate.github }}">

                        </div>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Portfolio

                    </label>

                    <input
                        type="url"
                        class="form-control"
                        name="portfolio"
                        value="{{ candidate.portfolio }}">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Status

                    </label>

                    <select
                        class="form-select"
                        name="status">

                        <option value="Applied"
                        {% if candidate.status=="Applied" %}selected{% endif %}>
                            Applied
                        </option>

                        <option value="Interview Scheduled"
                        {% if candidate.status=="Interview Scheduled" %}selected{% endif %}>
                            Interview Scheduled
                        </option>

                        <option value="Selected"
                        {% if candidate.status=="Selected" %}selected{% endif %}>
                            Selected
                        </option>

                        <option value="Offer Sent"
                        {% if candidate.status=="Offer Sent" %}selected{% endif %}>
                            Offer Sent
                        </option>

                        <option value="Rejected"
                        {% if candidate.status=="Rejected" %}selected{% endif %}>
                            Rejected
                        </option>

                    </select>

                </div>

                <div class="text-end">

                    <button
                        type="submit"
                        class="btn btn-success">

                        Update Candidate

                    </button>

                    <a
                        href="{{ url_for('candidate_management.candidates') }}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
