{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-warning">

                    <h3 class="mb-0">

                        <i class="bi bi-pencil-square"></i>

                        Edit User

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Username

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="username"
                                value="{{ user.username }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                value="{{ user.email }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Role

                            </label>

                            <select
                                class="form-select"
                                name="role"
                                required>

                                <option value="Admin"
                                {% if user.role=="Admin" %}selected{% endif %}>
                                    Admin
                                </option>

                                <option value="Recruiter"
                                {% if user.role=="Recruiter" %}selected{% endif %}>
                                    Recruiter
                                </option>

                            </select>

                        </div>

                        <div class="text-center">

                            <button
                                type="submit"
                                class="btn btn-success">

                                <i class="bi bi-check-circle"></i>

                                Update User

                            </button>

                            <a
                                href="{{ url_for('user_management.users') }}"
                                class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>

                                Back

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
