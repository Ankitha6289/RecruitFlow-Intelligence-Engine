{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h3>

                Edit Offer

            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">

                            Candidate

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ offer.candidate.full_name }}"
                            readonly>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Job

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ offer.job.job_title }}"
                            readonly>

                    </div>

                </div>

                <br>

                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">

                            Offered Salary

                        </label>

                        <input
                            type="number"
                            name="offered_salary"
                            class="form-control"
                            value="{{ offer.offered_salary }}"
                            required>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Offer Date

                        </label>

                        <input
                            type="date"
                            name="offer_date"
                            class="form-control"
                            value="{{ offer.offer_date }}"
                            required>

                    </div>

                </div>

                <br>

                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">

                            Joining Date

                        </label>

                        <input
                            type="date"
                            name="joining_date"
                            class="form-control"
                            value="{{ offer.joining_date }}"
                            required>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Status

                        </label>

                        <select
                            name="status"
                            class="form-select">

                            <option value="Pending"
                                {% if offer.status=="Pending" %}selected{% endif %}>
                                Pending
                            </option>

                            <option value="Accepted"
                                {% if offer.status=="Accepted" %}selected{% endif %}>
                                Accepted
                            </option>

                            <option value="Rejected"
                                {% if offer.status=="Rejected" %}selected{% endif %}>
                                Rejected
                            </option>

                        </select>

                    </div>

                </div>

                <br>

                <button
                    type="submit"
                    class="btn btn-warning">

                    Update Offer

                </button>

                <a
                    href="{{ url_for('offer_management.offers') }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
