{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>
                <i class="bi bi-bell-fill"></i>
                Add Notification
            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        placeholder="Enter Notification Title"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Message
                    </label>

                    <textarea
                        name="message"
                        class="form-control"
                        rows="5"
                        placeholder="Enter Notification Message"
                        required></textarea>

                </div>

                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">
                            Notification Type
                        </label>

                        <select
                            name="notification_type"
                            class="form-select"
                            required>

                            <option value="General">
                                General
                            </option>

                            <option value="Interview">
                                Interview
                            </option>

                            <option value="Offer">
                                Offer
                            </option>

                            <option value="System">
                                System
                            </option>

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Recipient
                        </label>

                        <select
                            name="recipient_role"
                            class="form-select"
                            required>

                            <option value="Admin">
                                Admin
                            </option>

                            <option value="Recruiter">
                                Recruiter
                            </option>

                            <option value="Candidate">
                                Candidate
                            </option>

                            <option value="All">
                                All Users
                            </option>

                        </select>

                    </div>

                </div>

                <br>

                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Save Notification

                </button>

                <a
                    href="{{ url_for('notification.notifications') }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
