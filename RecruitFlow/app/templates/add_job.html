{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header bg-success text-white">

                <h3 class="mb-0">

                    Add New Job

                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">

                            Job Title

                        </label>

                        <input
                            type="text"
                            name="job_title"
                            class="form-control"
                            placeholder="Enter Job Title"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Company

                        </label>

                        <input
                            type="text"
                            name="company"
                            class="form-control"
                            placeholder="Enter Company Name"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Location

                        </label>

                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            placeholder="Enter Job Location"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Experience

                        </label>

                        <input
                            type="text"
                            name="experience"
                            class="form-control"
                            placeholder="Example: 2+ Years"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Salary

                        </label>

                        <input
                            type="text"
                            name="salary"
                            class="form-control"
                            placeholder="Example: ₹8 LPA"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Required Skills

                        </label>

                        <textarea
                            name="skills"
                            class="form-control"
                            rows="3"
                            placeholder="Python, Flask, SQL"
                            required></textarea>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Eligibility

                        </label>

                        <textarea
                            name="eligibility"
                            class="form-control"
                            rows="2"
                            placeholder="B.E/B.Tech, MCA, Minimum 60%"
                            required></textarea>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Closing Date

                        </label>

                        <input
                            type="date"
                            name="closing_date"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            Job Description

                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="5"
                            placeholder="Enter Job Description"
                            required></textarea>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success">

                        Save Job

                    </button>

                    <a
                        href="{{ url_for('job_management.jobs') }}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
